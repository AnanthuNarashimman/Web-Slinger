    <!-- ── Link preview ──────────────────────────────────────────────────
         The card that renders when this URL is pasted into Slack, WhatsApp,
         LinkedIn, iMessage, Discord or X. Source: og/og-image.html, rendered
         to public/og.png at 1200x630.

         These URLs are absolute, and have to stay that way. A relative
         og:image is not resolved by WhatsApp, X or LinkedIn - they simply
         drop the image and show title and description alone, which is exactly
         what happened when these were written as /og.png.

         Crawlers cache aggressively. After changing the image, re-scrape via
         each platform's debugger, or test with a cache-busting query string.
         ──────────────────────────────────────────────────────────────── -->
